# main 에 올라오면 사이트를 새로 만들어 GitHub Pages 에 내보낸다.
# 저장소 Settings → Pages → Source 가 "GitHub Actions" 여야 한다.
name: 블로그 배포

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 패키지 설치
        run: npm ci
      - name: 사이트 만들기
        run: npx quartz build
      - name: 결과 올리기
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: GitHub Pages 에 내보내기
        id: deployment
        uses: actions/deploy-pages@v4
